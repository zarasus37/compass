name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cluster: Production deploy prep (2026-08-28).
# The smoke suite needs a Postgres. Spin up a service container
# for it. The dev compose file uses port 5433 (because Windows has
# native PG 18 on 5432) but on a clean Linux runner 5432 is fine —
# the DATABASE_URL here points to the service container's port.
#
# `scripts/verify-migrations.mjs` needs CREATE DATABASE rights to
# provision its own disposable databases; the service container's
# POSTGRES_USER is a superuser, so this works as-is.
#
# LLM is set to "mock" (deterministic seed) for CI so the smoke
# suite gets stable, predictable responses. Mavis creds are not
# required in CI.

jobs:
  validate:
    name: tsc + smokes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    env:
      DATABASE_URL: "postgresql://compass:compass@localhost:5432/compass_ci"
      LLM_PROVIDER: "mock"
      LLM_PROVIDER_ADVISOR: "mock"
      NODE_ENV: "development"
      # Skipped assertions must fail the run. Without this the suite
      # can "pass" while every server-touching check silently skipped —
      # which is how CI stayed green-looking while proving nothing.
      SMOKE_REQUIRE_SERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema
        run: pnpm db:push

      # Cluster 7.32b repair (2026-10-08). The step above CANNOT catch
      # migration-history problems, because `db push` builds tables
      # straight from the datamodel and records nothing in migration
      # history. That is exactly how `Debt`, `PaycheckRun` and
      # `ClientError` came to exist in every live database while no
      # migration had ever created them — a clean `migrate deploy`
      # reported "All migrations have been successfully applied" (exit
      # 0) and produced a database missing all three, including the
      # paycheck idempotency guard.
      #
      # This step installs from migrations on a disposable database and
      # asserts zero drift, on both the fresh path and the path where
      # `db push` already created the tables. It must run BEFORE the
      # smoke suite so a broken history fails fast and loudly.
      #
      # Proven non-vacuous: deleting the baseline migration turns this
      # into 15 missed checks and exit 1.
      - name: Verify migration history (fresh + existing DB)
        run: node scripts/verify-migrations.mjs

      # The baseline migration uses IF NOT EXISTS, which SKIPS an object
      # that already exists rather than verifying it. scripts/preflight-
      # schema.mjs answers "is THIS database's shape compatible with the
      # repair?" by comparing it against a migrations-built reference.
      #
      # Run here against the CI database purely to keep the guard itself
      # honest — a deployment gate that silently rots is worse than none.
      # Production still needs its own run before deploying.
      #
      # It opens a server-enforced read-only session and confirms the
      # setting by reading it back. It issues NO write against the
      # target — including the scratch reference database, which is
      # built separately for that reason.
      - name: Preflight guard self-check (read-only)
        run: node scripts/preflight-schema.mjs --label ci --allow-target-server-writes

      - name: Type check
        run: pnpm tsc

      - name: Lint (errors only; warnings do not fail)
        run: pnpm lint

      - name: Install Playwright browsers
        # smoke-mobile-shell drives a real Chromium via Playwright.
        # `pnpm install` does not fetch browser binaries, so without this
        # step the suite dies with "Executable doesn't exist" and every
        # later entry is dead. `--with-deps` also installs the OS
        # libraries Chromium needs on the runner image.
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev &
          # Wait for the server to be ready (Next prints "Ready in").
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "dev server is up"
              break
            fi
            sleep 1
          done

          # Warm the routes the chain touches FIRST, before declaring the
          # server usable. /api/health is a tiny route that compiles in
          # seconds; /login and /welcome are heavy (auth, argon2, prisma,
          # session, server actions) and compile on demand. A first hit on
          # a cold route can return 500 while its compile is in flight.
          #
          # The smoke chain is &&-chained from smoke-auth.mjs, so that one
          # 500 aborts everything and the run dies in ~1m50s instead of
          # ~13m — which reads like a fast, decisive failure and is not
          # one. Observed on run 36998303068, where the very next commit
          # (same code plus a markdown edit) passed.
          for route in /login /welcome; do
            for i in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${route}" || true)
              case "$code" in
                200|307)
                  echo "warm ${route} -> ${code}"
                  break
                  ;;
                *)
                  echo "warming ${route} (got ${code:-conn-refused})"
                  sleep 2
                  ;;
              esac
            done
          done

      - name: Run smoke suite
        run: |
          # data-layer smokes first (cheaper, fail-fast on schema drift)
          pnpm smoke
          # then the UI / page-render smokes
          pnpm smoke:ui
          # then the integration smoke (the M4 vault gateway one)
          pnpm smoke:integration
          # then the deploy-readiness smoke
          pnpm smoke:deploy

