# Compass dev pg_hba.conf — trust all for local docker development.
# Production deploy prep cluster (2026-08-28). Postgres-everywhere.
# The dev DB is throwaway; production uses Neon/Supabase/RDS with
# proper SCRAM-SHA-256 + TLS. This file is dev-only.
#
# Mounted into the container at /etc/postgresql/pg_hba.conf via the
# compose volume `docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro`
# so auth rules are reproducible across container recreations.
#
# Why trust? Windows Docker Desktop forwards host->container traffic
# over an unpredictable mix of IPv4 (NAT through the bridge) and
# IPv6 (the host's ::1 loopback) — there's no fixed source IP we
# can pin a `host ... CIDR` rule to. Trusting all in dev is fine
# because the container is reachable only via the local Docker
# bridge (published port bound to 127.0.0.1 by default, and the
# dev compose file does not expose the port externally).

# Allow any TCP connection from any IPv4 source without authentication.
host all all 0.0.0.0/0 trust
# Allow any TCP connection from any IPv6 source without authentication.
# Windows Docker Desktop forwards host->container traffic over IPv6
# (::1 loopback) so the IPv4 rule alone is not enough.
host all all ::/0 trust

# Allow local socket connections (used by the in-container psql
# during seed/migration runs).
local all all trust
local replication all trust
